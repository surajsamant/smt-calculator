<!DOCTYPE html>
<html>
<head>
  <title>SMT Affinity Optimizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <h1>🎬 Super Movie Tycoon Optimizer</h1>

  <div class="card">

    <div class="grid">

      <div>
        <label>Primary Genre</label>
        <select id="primary">
          <option>Action</option>
          <option>Horror</option>
          <option>Romance</option>
          <option>Comedy</option>
          <option>Drama</option>
          <option>Sci-Fi</option>
          <option>Crime</option>
          <option>Adventure</option>
          <option>Animation</option>
        </select>
      </div>

      <div>
        <label>Secondary Genre</label>
        <select id="secondary">
          <option>Action</option>
          <option>Horror</option>
          <option>Romance</option>
          <option>Comedy</option>
          <option>Drama</option>
          <option>Sci-Fi</option>
          <option>Crime</option>
          <option>Adventure</option>
          <option>Animation</option>
        </select>
      </div>

      <div>
        <label>Theme</label>
        <select id="theme">
          <option>Alien</option>
          <option>Disaster</option>
          <option>Dystopia</option>
          <option>Superhero</option>
          <option>Wedding</option>
          <option>Serial Killer</option>
          <option>Detective</option>
          <option>Magic</option>
          <option>Space</option>
        </select>
      </div>

      <div>
        <label>Age Rating</label>
        <select id="age">
          <option>PG</option>
          <option>PG-13</option>
          <option>R</option>
        </select>
      </div>

    </div>

    <button onclick="optimize()">Generate Optimal Build</button>

  </div>

  <div class="card result-card">
    <h2>Optimization Result</h2>
    <div id="output">Select configuration and generate.</div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
