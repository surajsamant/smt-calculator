<!DOCTYPE html>
<html>
<head>
  <title>SMT Pro Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🎬 SMT Pro Studio Dashboard</h1>
</header>

<div class="dashboard">

  <!-- SCRIPT SECTION -->
  <div class="card">
    <h2>📝 Script Development</h2>

    <label>Primary Genre</label>
    <select id="genre1">
      <option>Action</option>
      <option>Drama</option>
      <option>Horror</option>
      <option>Romance</option>
      <option>Sci-Fi</option>
      <option>Comedy</option>
    </select>

    <label>Secondary Genre</label>
    <select id="genre2">
      <option>None</option>
      <option>Adventure</option>
      <option>Thriller</option>
      <option>Drama</option>
      <option>Fantasy</option>
    </select>

    <label>Trend Strength</label>
    <select id="trend">
      <option value="20">Strong</option>
      <option value="15">Medium</option>
      <option value="10">Weak</option>
    </select>

    <label>Research Level (0–100)</label>
    <input type="number" id="research">

    <button onclick="calculateScript()">Analyze Script</button>

    <div class="result" id="scriptResult"></div>
  </div>

  <!-- MOVIE SECTION -->
  <div class="card">
    <h2>🎥 Production Phase</h2>

    <label>Main Actor Skill</label>
    <input type="number" id="actor">

    <label>Director Skill</label>
    <input type="number" id="director">

    <label>Budget Allocation</label>
    <select id="budget">
      <option value="20">Optimized</option>
      <option value="15">Balanced</option>
      <option value="10">Poor</option>
    </select>

    <label>Marketing Intensity</label>
    <select id="marketing">
      <option value="20">High</option>
      <option value="15">Medium</option>
      <option value="10">Low</option>
    </select>

    <button onclick="calculateMovie()">Predict Movie</button>

    <div class="result" id="movieResult"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
