<!DOCTYPE html>
<html>
<head>
  <title>SMT Movie Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎬 Super Movie Tycoon Helper</h1>

<div class="container">

<h2>📝 Script Section</h2>

<label>Primary Genre</label>
<select id="genre">
  <option>Action</option>
  <option>Drama</option>
  <option>Horror</option>
  <option>Romance</option>
  <option>Comedy</option>
  <option>Sci-Fi</option>
</select>

<label>Research Level (1–10)</label>
<input type="number" id="research" min="1" max="10">

<label>Trend Strength (1–3)</label>
<input type="number" id="trend" min="1" max="3">

<hr>

<h2>✍️ Writing Focus (1–10 each)</h2>

<label>Narrative</label><input type="number" id="narrative" min="1" max="10">
<label>Action</label><input type="number" id="action" min="1" max="10">
<label>Emotion</label><input type="number" id="emotion" min="1" max="10">
<label>Depth</label><input type="number" id="depth" min="1" max="10">

<hr>

<h2>🎥 Production Section</h2>

<label>Director Skill (1–10)</label>
<input type="number" id="director" min="1" max="10">

<label>Lead Actor Skill (1–10)</label>
<input type="number" id="lead" min="1" max="10">

<label>Shooting Tech (1–10)</label>
<input type="number" id="tech" min="1" max="10">

<label>Visual Focus (1–10)</label>
<input type="number" id="visual" min="1" max="10">

<br><br>

<button onclick="calculate()">Analyze Movie</button>

<h2 id="result"></h2>

</div>

<script src="script.js"></script>
</body>
</html>
